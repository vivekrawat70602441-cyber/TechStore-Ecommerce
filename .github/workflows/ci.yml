name: TechStore CI

on:
  push:
    branches:
       - main

  pull_request:
    branches:
       - main

jobs: 
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults: 
        run: 
          working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
        
      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
        run:
          working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install backend dependencies
        run: npm ci

